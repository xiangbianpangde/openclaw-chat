version: '3.8'

services:
  # API 服务
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:caiwu123@mysql:3306/caiwu_assistant
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=caiwu
      - MINIO_SECRET_KEY=caiwu123456
      - JWT_SECRET=your-secret-key-change-in-production
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - mysql
      - redis
      - minio
    networks:
      - caiwu-network

  # Celery Worker
  celery-worker:
    build: .
    command: celery -A src.core.celery_app worker --loglevel=info --concurrency=8
    environment:
      - DATABASE_URL=mysql+pymysql://root:caiwu123@mysql:3306/caiwu_assistant
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=caiwu
      - MINIO_SECRET_KEY=caiwu123456
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - mysql
      - redis
      - minio
    networks:
      - caiwu-network

  # Celery Beat (定时任务)
  celery-beat:
    build: .
    command: celery -A src.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=mysql+pymysql://root:caiwu123@mysql:3306/caiwu_assistant
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - caiwu-network

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: caiwu123
      MYSQL_DATABASE: caiwu_assistant
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - caiwu-network

  # Redis 缓存
  redis:
    image: redis:7.0
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - caiwu-network

  # MinIO 对象存储
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: caiwu
      MINIO_ROOT_PASSWORD: caiwu123456
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - caiwu-network

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - caiwu-network

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: caiwu123
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - caiwu-network

  # Elasticsearch (日志)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - caiwu-network

  # Kibana (日志可视化)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - caiwu-network

networks:
  caiwu-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
