name: openclaw_im_client
description: "OpenClaw IM Client v2.0 - Official Flutter client for OpenClaw Gateway"
publish_to: 'none'

version: 2.0.0+5

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # WebSocket - Gateway 协议核心
  web_socket_channel: ^2.4.0
  
  # 状态管理 - flutter_bloc
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # 本地存储 - Hive (高性能)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 安全存储 - Token 加密
  flutter_secure_storage: ^9.0.0
  
  # WebView - 内置浏览器 + noVNC
  webview_flutter: ^4.4.2
  
  # 网络连接检测
  connectivity_plus: ^5.0.2
  
  # JSON 解析
  json_annotation: ^4.8.1
  
  # HTTP 客户端
  dio: ^5.4.0
  
  # 日志
  logger: ^2.0.2+1
  
  # 国际化
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0
  
  # 代码生成
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  # noVNC 静态资源
  assets:
    - assets/noVNC/
    - assets/images/
